# Postgres local para desarrollo y pruebas (pnpm db:up). Mismo motor que Neon.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mimark
    ports:
      - '5432:5432'
    volumes:
      - mimark-pg:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mimark']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mimark-pg:
